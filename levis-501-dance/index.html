<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Levi's 501 · 高精 GLB 3D 舞蹈舞台</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%; overflow: hidden; background: #0c0e17;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      color: #f8fafc; user-select: none; -webkit-user-select: none;
    }
    #canvas-container { position: fixed; inset: 0; width: 100%; height: 100%; cursor: grab; }
    #canvas-container:active { cursor: grabbing; }
    .loader-overlay {
      position: fixed; inset: 0; z-index: 40;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
      background: radial-gradient(circle at center, rgba(20, 26, 46, 0.92), rgba(10, 12, 22, 0.98));
      transition: opacity 0.45s ease, visibility 0.45s ease;
    }
    .loader-overlay.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    .loader-badge {
      background: linear-gradient(135deg, #d91433, #a80c24);
      padding: 7px 14px; border-radius: 8px; font-weight: 800; font-size: 14px; letter-spacing: 0.05em;
      box-shadow: 0 4px 18px rgba(217, 20, 51, 0.5);
    }
    .loader-title { font-size: 16px; font-weight: 600; color: #f1f5f9; }
    .progress-track { width: min(300px, 76vw); height: 6px; border-radius: 999px; background: rgba(255, 255, 255, 0.12); overflow: hidden; }
    .progress-fill { height: 100%; width: 8%; border-radius: 999px; background: linear-gradient(90deg, #3b82f6, #f43f5e); transition: width 0.2s ease; }
    .loader-sub { font-size: 12px; color: #94a3b8; }
    .top-bar {
      position: fixed; top: 16px; left: 16px; right: 16px;
      display: flex; align-items: flex-start; justify-content: space-between;
      pointer-events: none; z-index: 20; gap: 12px;
    }
    .brand-card {
      pointer-events: auto; display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-radius: 16px;
      background: rgba(14, 18, 30, 0.72); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12); box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
    }
    .red-tab {
      background: linear-gradient(135deg, #d91433, #a80c24); color: #ffffff; font-weight: 800; font-size: 13px;
      letter-spacing: 0.04em; padding: 6px 10px; border-radius: 6px; box-shadow: 0 2px 12px rgba(217, 20, 51, 0.5); white-space: nowrap;
    }
    .brand-text h1 { font-size: 15px; font-weight: 700; letter-spacing: 0.01em; line-height: 1.2; }
    .brand-text p { font-size: 12px; color: #94a3b8; margin-top: 2px; }
    .top-actions { pointer-events: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
    .icon-btn {
      display: inline-flex; align-items: center; gap: 6px; padding: 9px 13px; border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.14); background: rgba(14, 18, 30, 0.72);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      color: #f1f5f9; font-size: 12.5px; font-weight: 600; cursor: pointer; transition: all 0.2s ease;
    }
    .icon-btn:hover { background: rgba(30, 41, 68, 0.88); border-color: rgba(255, 255, 255, 0.3); }
    .icon-btn.active { background: rgba(200, 16, 46, 0.9); border-color: rgba(255, 130, 150, 0.6); color: #fff; }
    #glb-file-input { display: none; }
    .control-dock {
      position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); z-index: 20;
      width: min(800px, calc(100vw - 24px)); background: rgba(12, 16, 28, 0.78);
      backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, 0.13); border-radius: 20px; padding: 14px 18px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.48); transition: transform 0.28s ease, opacity 0.25s ease;
    }
    .control-dock.collapsed { transform: translate(-50%, calc(100% + 26px)); opacity: 0; pointer-events: none; }
    .dock-grid { display: grid; grid-template-columns: 1.15fr 1fr 0.95fr; gap: 14px; align-items: center; }
    .ctrl-group { display: flex; flex-direction: column; gap: 6px; }
    .ctrl-label { font-size: 11px; font-weight: 600; color: #94a3b8; letter-spacing: 0.04em; display: flex; justify-content: space-between; align-items: center; }
    .pill-row { display: flex; flex-wrap: wrap; gap: 6px; }
    .pill {
      flex: 1 1 auto; padding: 6px 10px; border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.12); background: rgba(255, 255, 255, 0.05);
      color: #cbd5e1; font-size: 12px; font-weight: 600; cursor: pointer;
      transition: all 0.18s ease; text-align: center; white-space: nowrap;
    }
    .pill:hover { background: rgba(255, 255, 255, 0.13); color: #fff; }
    .pill.active { background: #2563eb; border-color: #60a5fa; color: #ffffff; box-shadow: 0 2px 10px rgba(37, 99, 235, 0.45); }
    .pill.accent.active { background: #c8102e; border-color: #fb7185; box-shadow: 0 2px 10px rgba(200, 16, 46, 0.45); }
    .slider-wrap { display: flex; align-items: center; gap: 10px; }
    input[type="range"] { -webkit-appearance: none; appearance: none; width: 100%; height: 6px; border-radius: 999px; background: rgba(255, 255, 255, 0.16); outline: none; cursor: pointer; }
    input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 16px; height: 16px; border-radius: 50%; background: #f8fafc; border: 2px solid #2563eb; box-shadow: 0 0 10px rgba(59, 130, 246, 0.65); }
    .hint-bar { margin-top: 10px; padding-top: 9px; border-top: 1px solid rgba(255, 255, 255, 0.08); display: flex; justify-content: space-between; align-items: center; font-size: 11.5px; color: #94a3b8; flex-wrap: wrap; gap: 8px; }
    .hint-badges { display: flex; gap: 6px; flex-wrap: wrap; }
    .mini-chip { background: rgba(255, 255, 255, 0.07); padding: 3px 8px; border-radius: 999px; color: #cbd5e1; font-size: 11px; }
    .toast {
      position: fixed; top: 76px; left: 50%; transform: translateX(-50%) translateY(-10px); z-index: 50;
      padding: 9px 16px; border-radius: 12px; background: rgba(15, 23, 42, 0.92);
      border: 1px solid rgba(96, 165, 250, 0.4); color: #e2e8f0; font-size: 12.5px;
      opacity: 0; pointer-events: none; transition: all 0.25s ease;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    @media (max-width: 720px) {
      .dock-grid { grid-template-columns: 1fr; gap: 10px; }
      .brand-text p { display: none; }
      .control-dock { padding: 12px 14px; bottom: 12px; }
      .hint-bar { display: none; }
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>
  <div id="loader-overlay" class="loader-overlay">
    <div class="loader-badge">Levi's 501® · GLB</div>
    <div id="loader-title" class="loader-title">正在加载高精度 GLB 骨骼舞蹈模型...</div>
    <div class="progress-track"><div id="progress-fill" class="progress-fill"></div></div>
    <div id="loader-sub" class="loader-sub">Michelle.glb (Mixamo 写实骨骼动画 · 3.1 MB)</div>
  </div>
  <div id="toast" class="toast"></div>
  <div class="top-bar">
    <div class="brand-card">
      <div class="red-tab">Levi's 501®</div>
      <div class="brand-text">
        <h1>高精 GLB 牛仔裤舞者 · 3D 舞台</h1>
        <p id="model-subtitle">正在加载写实骨骼蒙皮动画...</p>
      </div>
    </div>
    <div class="top-actions">
      <input id="glb-file-input" type="file" accept=".glb,.gltf" />
      <button id="btn-upload" class="icon-btn" title="替换本地 GLB 模型">↑ 换 GLB 模型</button>
      <button id="btn-music" class="icon-btn" title="切换节奏音乐">♪ 节拍: 关</button>
      <button id="btn-play" class="icon-btn active" title="暂停/继续舞蹈">❚❚ 跳舞中</button>
      <button id="btn-panel" class="icon-btn" title="展开/收起控制面板">收起面板</button>
    </div>
  </div>
  <div id="control-dock" class="control-dock">
    <div class="dock-grid">
      <div class="ctrl-group">
        <div class="ctrl-label"><span>舞台与丹宁风格</span><span id="style-badge" style="color:#93c5fd;">501 经典蓝</span></div>
        <div class="pill-row" id="dance-pills">
          <button class="pill active" data-style="pop">501 经典蓝</button>
          <button class="pill" data-style="disco">复古深原牛</button>
          <button class="pill" data-style="flow">模型原色</button>
        </div>
      </div>
      <div class="ctrl-group">
        <div class="ctrl-label"><span>镜头视角</span><span id="cam-badge" style="color:#fda4af;">全景舞台</span></div>
        <div class="pill-row" id="cam-pills">
          <button class="pill accent active" data-cam="full">全景</button>
          <button class="pill accent" data-cam="jeans">牛仔裤特写</button>
          <button class="pill accent" data-cam="back">背面视角</button>
          <button class="pill accent" data-cam="orbit">自动环绕</button>
        </div>
      </div>
      <div class="ctrl-group">
        <div class="ctrl-label"><span>舞蹈速度</span><span id="bpm-val" style="color:#f8fafc;">1.00x · 116 BPM</span></div>
        <div class="slider-wrap"><input id="bpm-slider" type="range" min="60" max="174" value="116" step="2" /></div>
        <div class="pill-row" id="light-pills" style="margin-top:2px;">
          <button class="pill active" data-light="sunset">落日影棚</button>
          <button class="pill" data-light="club">霓虹舞台</button>
          <button class="pill" data-light="studio">柔光自然</button>
        </div>
      </div>
    </div>
    <div class="hint-bar">
      <span>左键拖动 360° 环绕 · 滚轮缩放 · 可直接将任意 Mixamo / Blender 导出的 .glb 拖入页面替换</span>
      <div class="hint-badges"><span class="mini-chip">Three.js GLTFLoader</span><span class="mini-chip">PBR Studio IBL</span></div>
    </div>
  </div>
  <script>
    (function () {
      const container = document.getElementById('canvas-container');
      const loaderOverlay = document.getElementById('loader-overlay');
      const loaderTitle = document.getElementById('loader-title');
      const loaderSub = document.getElementById('loader-sub');
      const progressFill = document.getElementById('progress-fill');
      const toastEl = document.getElementById('toast');

      function showToast(msg) {
        toastEl.textContent = msg; toastEl.classList.add('show');
        clearTimeout(showToast._t);
        showToast._t = setTimeout(() => toastEl.classList.remove('show'), 2800);
      }

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x101320);
      scene.fog = new THREE.FogExp2(0x101320, 0.032);
      const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.05, 100);
      const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.outputEncoding = THREE.sRGBEncoding;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.18;
      container.appendChild(renderer.domElement);

      function buildStudioEnvMap() {
        const envScene = new THREE.Scene(); envScene.background = new THREE.Color(0x23293e);
        [
          { pos: [0, 6, 4], scale: [10, 5, 0.2], color: 0xfff5e8 },
          { pos: [-7, 3, -2], scale: [0.2, 6, 8], color: 0xf472b6 },
          { pos: [7, 3, -2], scale: [0.2, 6, 8], color: 0x38bdf8 },
          { pos: [0, 8, -4], scale: [12, 0.2, 6], color: 0xf8fafc },
          { pos: [0, -4, 0], scale: [14, 0.2, 14], color: 0x1e293b }
        ].forEach((p) => {
          const m = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshBasicMaterial({ color: p.color }));
          m.position.set(...p.pos); m.scale.set(...p.scale); envScene.add(m);
        });
        const pmrem = new THREE.PMREMGenerator(renderer); pmrem.compileEquirectangularShader();
        const rt = pmrem.fromScene(envScene, 0.04); pmrem.dispose(); return rt.texture;
      }
      scene.environment = buildStudioEnvMap();

      function createStageFloorTexture() {
        const c = document.createElement('canvas'); c.width = 1024; c.height = 1024;
        const ctx = c.getContext('2d');
        const g = ctx.createRadialGradient(512, 512, 30, 512, 512, 512);
        g.addColorStop(0, '#262d47'); g.addColorStop(0.5, '#161a2b'); g.addColorStop(1, '#0c0e17');
        ctx.fillStyle = g; ctx.fillRect(0, 0, 1024, 1024);
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.07)'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(512, 512, 230, 0, Math.PI * 2); ctx.stroke();
        ctx.beginPath(); ctx.arc(512, 512, 340, 0, Math.PI * 2); ctx.stroke();
        const tex = new THREE.CanvasTexture(c); tex.encoding = THREE.sRGBEncoding; tex.anisotropy = 8; return tex;
      }

      const floor = new THREE.Mesh(new THREE.CircleGeometry(10, 72), new THREE.MeshStandardMaterial({
        map: createStageFloorTexture(), roughness: 0.28, metalness: 0.26, envMapIntensity: 0.75
      }));
      floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);

      const ring1Mat = new THREE.MeshBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.5 });
      const ring1 = new THREE.Mesh(new THREE.RingGeometry(1.18, 1.21, 72), ring1Mat);
      ring1.rotation.x = -Math.PI / 2; ring1.position.y = 0.003; scene.add(ring1);

      const ring2Mat = new THREE.MeshBasicMaterial({ color: 0xf43f5e, transparent: true, opacity: 0.34 });
      const ring2 = new THREE.Mesh(new THREE.RingGeometry(2.1, 2.125, 72), ring2Mat);
      ring2.rotation.x = -Math.PI / 2; ring2.position.y = 0.002; scene.add(ring2);

      const particleCount = 160, pGeo = new THREE.BufferGeometry(), pPos = new Float32Array(particleCount * 3);
      for (let i = 0; i < particleCount; i++) {
        const r = 1.6 + Math.random() * 5.0, a = Math.random() * Math.PI * 2;
        pPos[i * 3] = Math.cos(a) * r; pPos[i * 3 + 1] = 0.3 + Math.random() * 3.5; pPos[i * 3 + 2] = Math.sin(a) * r;
      }
      pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
      const particles = new THREE.Points(pGeo, new THREE.PointsMaterial({ color: 0xfde68a, size: 0.03, transparent: true, opacity: 0.55 }));
      scene.add(particles);

      const hemiLight = new THREE.HemisphereLight(0xfff4e8, 0x26284a, 1.35); scene.add(hemiLight);
      const keyLight = new THREE.DirectionalLight(0xfff1e0, 1.75);
      keyLight.position.set(2.4, 4.6, 3.4); keyLight.castShadow = true;
      keyLight.shadow.mapSize.width = 2048; keyLight.shadow.mapSize.height = 2048;
      keyLight.shadow.camera.near = 0.5; keyLight.shadow.camera.far = 16;
      keyLight.shadow.camera.left = -2.5; keyLight.shadow.camera.right = 2.5;
      keyLight.shadow.camera.top = 3.0; keyLight.shadow.camera.bottom = -1.0;
      keyLight.shadow.bias = -0.0005; scene.add(keyLight);

      const fillLight = new THREE.DirectionalLight(0xdbeafe, 0.9); fillLight.position.set(-2.6, 2.6, 2.4); scene.add(fillLight);
      const rimLightA = new THREE.PointLight(0xf43f5e, 1.6, 10); rimLightA.position.set(-2.3, 2.2, -2.0); scene.add(rimLightA);
      const rimLightB = new THREE.PointLight(0x38bdf8, 1.5, 10); rimLightB.position.set(2.4, 2.0, -2.1); scene.add(rimLightB);

      const lightPresets = {
        sunset: { bg: 0x101320, key: 0xffebd6, keyInt: 1.75, rimA: 0xf43f5e, rimB: 0x38bdf8, hemiSky: 0xfff4e8, hemiGround: 0x26284a, ring1: 0x38bdf8, ring2: 0xf43f5e },
        club: { bg: 0x090a14, key: 0xe0e7ff, keyInt: 1.45, rimA: 0xd946ef, rimB: 0x06b6d4, hemiSky: 0x93c5fd, hemiGround: 0x0f172a, ring1: 0x06b6d4, ring2: 0xd946ef },
        studio: { bg: 0x1d2332, key: 0xffffff, keyInt: 2.0, rimA: 0xfef3c7, rimB: 0xbae6fd, hemiSky: 0xffffff, hemiGround: 0x334155, ring1: 0x93c5fd, ring2: 0xfca5a5 }
      };
      function applyLighting(presetKey) {
        const p = lightPresets[presetKey] || lightPresets.sunset;
        scene.background.setHex(p.bg); scene.fog.color.setHex(p.bg);
        keyLight.color.setHex(p.key); keyLight.intensity = p.keyInt;
        rimLightA.color.setHex(p.rimA); rimLightB.color.setHex(p.rimB);
        hemiLight.color.setHex(p.hemiSky); hemiLight.groundColor.setHex(p.hemiGround);
        ring1Mat.color.setHex(p.ring1); ring2Mat.color.setHex(p.ring2);
      }

      const modelRoot = new THREE.Group(); scene.add(modelRoot);
      let currentModel = null, mixer = null, activeAction = null;
      const savedMaterialColors = new Map();
      const state = { playing: true, style: 'pop', bpm: 116, phase: 0 };

      function applyDenimGrade(styleKey) {
        if (!currentModel) return;
        currentModel.traverse((obj) => {
          if (!obj.isMesh || !obj.material) return;
          const mats = Array.isArray(obj.material) ? obj.material : [obj.material];
          mats.forEach((m) => {
            if (!m.color) return;
            const orig = savedMaterialColors.get(m.uuid);
            if (!orig) return;
            if (styleKey === 'pop') m.color.copy(orig).multiply(new THREE.Color(0.95, 0.99, 1.08));
            else if (styleKey === 'disco') m.color.copy(orig).multiply(new THREE.Color(0.82, 0.88, 1.05));
            else m.color.copy(orig);
            m.needsUpdate = true;
          });
        });
      }

      function mountGLTF(gltf, label, isDefaultMichelle) {
        if (currentModel) { modelRoot.remove(currentModel); currentModel = null; }
        if (mixer) { mixer.stopAllAction(); mixer = null; activeAction = null; }
        savedMaterialColors.clear();
        const model = gltf.scene;
        model.traverse((child) => {
          if (child.isMesh) {
            child.castShadow = true; child.receiveShadow = true; child.frustumCulled = false;
            const mats = Array.isArray(child.material) ? child.material : [child.material];
            mats.forEach((m) => {
              if (m && m.color && !savedMaterialColors.has(m.uuid)) savedMaterialColors.set(m.uuid, m.color.clone());
              if (m && 'envMapIntensity' in m) m.envMapIntensity = 0.85;
            });
          }
        });
        model.updateMatrixWorld(true);
        if (isDefaultMichelle) {
          model.scale.setScalar(1); model.position.set(0, 0, 0);
        } else {
          let hasSkinned = false;
          model.traverse((c) => { if (c.isSkinnedMesh) hasSkinned = true; });
          if (!hasSkinned) {
            const box = new THREE.Box3().setFromObject(model), size = new THREE.Vector3();
            box.getSize(size);
            if (size.y > 0.05 && (size.y > 4 || size.y < 0.5)) model.scale.setScalar(THREE.MathUtils.clamp(1.72 / size.y, 0.005, 50));
            model.updateMatrixWorld(true);
            const scaledBox = new THREE.Box3().setFromObject(model), scaledCenter = new THREE.Vector3();
            scaledBox.getCenter(scaledCenter);
            model.position.x -= scaledCenter.x; model.position.z -= scaledCenter.z; model.position.y -= scaledBox.min.y;
          } else {
            model.scale.setScalar(1); model.position.set(0, 0, 0);
          }
        }
        modelRoot.add(model); currentModel = model; applyDenimGrade(state.style);
        if (gltf.animations && gltf.animations.length > 0) {
          mixer = new THREE.AnimationMixer(model);
          activeAction = mixer.clipAction(gltf.animations[0]);
          activeAction.play(); activeAction.timeScale = state.bpm / 116;
          document.getElementById('model-subtitle').textContent = `${label} · 骨骼动画 (${gltf.animations[0].name || 'Dance'})`;
        } else {
          document.getElementById('model-subtitle').textContent = `${label} · 静态展示模式（未包含骨骼动画）`;
        }
        loaderOverlay.classList.add('hidden');
        showToast(`已加载高精模型：${label}`);
      }

      const defaultGlbUrls = [
        'https://cdn.jsdelivr.net/gh/mrdoob/three.js@dev/examples/models/gltf/Michelle.glb',
        'https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/models/gltf/Michelle.glb',
        'https://threejs.org/examples/models/gltf/Michelle.glb'
      ];
      const gltfLoader = new THREE.GLTFLoader();
      function loadDefaultGLB(urlIndex) {
        if (urlIndex >= defaultGlbUrls.length) {
          loaderTitle.textContent = '模型加载失败（网络受限）';
          loaderSub.textContent = '请点击右上角「↑ 换 GLB 模型」选择本地 .glb 文件，或刷新重试';
          document.getElementById('model-subtitle').textContent = 'GLB 下载失败，请检查网络或拖入本地 .glb';
          progressFill.style.width = '100%';
          setTimeout(() => loaderOverlay.classList.add('hidden'), 2400);
          return;
        }
        loaderSub.textContent = `正在从 CDN 源 ${urlIndex + 1}/${defaultGlbUrls.length} 加载 Michelle.glb...`;
        gltfLoader.load(
          defaultGlbUrls[urlIndex],
          (gltf) => { progressFill.style.width = '100%'; mountGLTF(gltf, 'Michelle.glb (Mixamo 写实牛仔裤舞者)', true); },
          (xhr) => { if (xhr && xhr.total > 0) progressFill.style.width = Math.min(96, Math.round((xhr.loaded / xhr.total) * 100)) + '%'; },
          () => loadDefaultGLB(urlIndex + 1)
        );
      }

      function loadLocalFile(file) {
        if (!file) return;
        loaderOverlay.classList.remove('hidden');
        loaderTitle.textContent = `正在解析 ${file.name}...`;
        loaderSub.textContent = '本地 GLB 骨骼模型加载中';
        progressFill.style.width = '50%';
        const reader = new FileReader();
        reader.onload = (ev) => {
          gltfLoader.parse(ev.target.result, '', (gltf) => { progressFill.style.width = '100%'; mountGLTF(gltf, file.name, false); }, () => {
            loaderOverlay.classList.add('hidden'); showToast('GLB 文件解析失败，请确认是有效的 .glb 模型');
          });
        };
        reader.readAsArrayBuffer(file);
      }

      const fileInput = document.getElementById('glb-file-input');
      document.getElementById('btn-upload').addEventListener('click', () => fileInput.click());
      fileInput.addEventListener('change', (e) => { if (e.target.files && e.target.files[0]) loadLocalFile(e.target.files[0]); });
      window.addEventListener('dragover', (e) => e.preventDefault());
      window.addEventListener('drop', (e) => { e.preventDefault(); if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]) loadLocalFile(e.dataTransfer.files[0]); });

      const camState = { theta: 0.25, phi: 1.40, radius: 3.15, targetY: 0.96, goalTheta: 0.25, goalPhi: 1.40, goalRadius: 3.15, goalTargetY: 0.96, autoOrbit: false, dragging: false, lastX: 0, lastY: 0 };
      function setCameraPreset(preset) {
        camState.autoOrbit = false;
        if (preset === 'full') { camState.goalTheta = 0.24; camState.goalPhi = 1.40; camState.goalRadius = 3.15; camState.goalTargetY = 0.96; }
        else if (preset === 'jeans') { camState.goalTheta = 0.14; camState.goalPhi = 1.48; camState.goalRadius = 1.58; camState.goalTargetY = 0.72; }
        else if (preset === 'back') { camState.goalTheta = Math.PI - 0.22; camState.goalPhi = 1.44; camState.goalRadius = 1.65; camState.goalTargetY = 0.86; }
        else if (preset === 'orbit') { camState.autoOrbit = true; camState.goalPhi = 1.38; camState.goalRadius = 2.95; camState.goalTargetY = 0.96; }
      }
      container.addEventListener('pointerdown', (e) => { camState.dragging = true; camState.autoOrbit = false; camState.lastX = e.clientX; camState.lastY = e.clientY; });
      window.addEventListener('pointermove', (e) => {
        if (!camState.dragging) return;
        const dx = e.clientX - camState.lastX, dy = e.clientY - camState.lastY;
        camState.lastX = e.clientX; camState.lastY = e.clientY;
        camState.goalTheta -= dx * 0.0075;
        camState.goalPhi = Math.max(0.55, Math.min(1.62, camState.goalPhi - dy * 0.0058));
      });
      window.addEventListener('pointerup', () => { camState.dragging = false; });
      container.addEventListener('wheel', (e) => { e.preventDefault(); camState.goalRadius = Math.max(1.15, Math.min(5.6, camState.goalRadius + e.deltaY * 0.002)); }, { passive: false });

      let audioCtx = null, musicEnabled = false, nextStepTime = 0, stepIndex = 0, audioTimer = null;
      function playKick(time) {
        const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
        osc.type = 'sine'; osc.frequency.setValueAtTime(135, time); osc.frequency.exponentialRampToValueAtTime(42, time + 0.14);
        gain.gain.setValueAtTime(0.30, time); gain.gain.exponentialRampToValueAtTime(0.001, time + 0.22);
        osc.connect(gain); gain.connect(audioCtx.destination); osc.start(time); osc.stop(time + 0.24);
      }
      function playHat(time, accent) {
        const bufferSize = audioCtx.sampleRate * 0.05, buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate), data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
        const noise = audioCtx.createBufferSource(); noise.buffer = buffer;
        const filter = audioCtx.createBiquadFilter(); filter.type = 'highpass'; filter.frequency.value = 7400;
        const gain = audioCtx.createGain(); gain.gain.setValueAtTime(accent ? 0.085 : 0.04, time); gain.gain.exponentialRampToValueAtTime(0.001, time + 0.05);
        noise.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination); noise.start(time);
      }
      function playBass(time, freq) {
        const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
        osc.type = 'triangle'; osc.frequency.setValueAtTime(freq, time);
        gain.gain.setValueAtTime(0.13, time); gain.gain.exponentialRampToValueAtTime(0.001, time + 0.2);
        osc.connect(gain); gain.connect(audioCtx.destination); osc.start(time); osc.stop(time + 0.22);
      }
      const bassNotes = [110, 110, 130.81, 146.83, 110, 164.81, 146.83, 130.81];
      function scheduleAudio() {
        if (!musicEnabled || !audioCtx) return;
        const sixteenth = (60 / state.bpm) / 4;
        while (nextStepTime < audioCtx.currentTime + 0.12) {
          const s = stepIndex % 16;
          if (s % 4 === 0) playKick(nextStepTime);
          if (s % 2 === 1) playHat(nextStepTime, s % 4 === 3);
          if (s % 2 === 0) playBass(nextStepTime, bassNotes[(s / 2) % bassNotes.length]);
          nextStepTime += sixteenth; stepIndex++;
        }
      }
      function toggleMusic() {
        musicEnabled = !musicEnabled;
        const btn = document.getElementById('btn-music');
        if (musicEnabled) {
          if (!audioCtx) { const AC = window.AudioContext || window.webkitAudioContext; audioCtx = new AC(); }
          if (audioCtx.state === 'suspended') audioCtx.resume();
          nextStepTime = audioCtx.currentTime + 0.04; stepIndex = 0;
          if (audioTimer) clearInterval(audioTimer);
          audioTimer = setInterval(scheduleAudio, 35);
          btn.textContent = '♪ 节拍: 开'; btn.classList.add('active');
        } else {
          if (audioTimer) { clearInterval(audioTimer); audioTimer = null; }
          btn.textContent = '♪ 节拍: 关'; btn.classList.remove('active');
        }
      }

      const styleNames = { pop: '501 经典蓝', disco: '复古深原牛', flow: '模型原色' };
      const camNames = { full: '全景舞台', jeans: '牛仔裤特写', back: '背面视角', orbit: '自动环绕' };
      document.querySelectorAll('#dance-pills .pill').forEach((btn) => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('#dance-pills .pill').forEach((b) => b.classList.remove('active'));
          btn.classList.add('active'); state.style = btn.dataset.style;
          document.getElementById('style-badge').textContent = styleNames[state.style]; applyDenimGrade(state.style);
        });
      });
      document.querySelectorAll('#cam-pills .pill').forEach((btn) => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('#cam-pills .pill').forEach((b) => b.classList.remove('active'));
          btn.classList.add('active'); const c = btn.dataset.cam; setCameraPreset(c);
          document.getElementById('cam-badge').textContent = camNames[c];
        });
      });
      document.querySelectorAll('#light-pills .pill').forEach((btn) => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('#light-pills .pill').forEach((b) => b.classList.remove('active'));
          btn.classList.add('active'); applyLighting(btn.dataset.light);
        });
      });

      const bpmSlider = document.getElementById('bpm-slider'), bpmVal = document.getElementById('bpm-val');
      bpmSlider.addEventListener('input', () => {
        state.bpm = Number(bpmSlider.value);
        bpmVal.textContent = `${(state.bpm / 116).toFixed(2)}x · ${state.bpm} BPM`;
        if (activeAction) activeAction.timeScale = state.bpm / 116;
      });
      const btnPlay = document.getElementById('btn-play');
      btnPlay.addEventListener('click', () => {
        state.playing = !state.playing;
        btnPlay.textContent = state.playing ? '❚❚ 跳舞中' : '▶ 已暂停';
        btnPlay.classList.toggle('active', state.playing);
      });
      document.getElementById('btn-music').addEventListener('click', toggleMusic);
      const dock = document.getElementById('control-dock'), btnPanel = document.getElementById('btn-panel');
      btnPanel.addEventListener('click', () => {
        const collapsed = dock.classList.toggle('collapsed');
        btnPanel.textContent = collapsed ? '展开面板' : '收起面板';
      });
      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      const clock = new THREE.Clock();
      function animate() {
        requestAnimationFrame(animate);
        const dt = Math.min(clock.getDelta(), 0.05);
        if (state.playing) { state.phase += dt * (state.bpm / 60) * Math.PI; if (mixer) mixer.update(dt); }
        particles.rotation.y += dt * 0.06;
        const pulse = 1 + Math.sin(state.phase * 2) * 0.02; ring1.scale.set(pulse, pulse, 1);
        if (camState.autoOrbit) camState.goalTheta += dt * 0.42;
        camState.theta += (camState.goalTheta - camState.theta) * 0.09;
        camState.phi += (camState.goalPhi - camState.phi) * 0.09;
        camState.radius += (camState.goalRadius - camState.radius) * 0.09;
        camState.targetY += (camState.goalTargetY - camState.targetY) * 0.09;
        const sinPhi = Math.sin(camState.phi);
        camera.position.set(
          camState.radius * sinPhi * Math.sin(camState.theta),
          camState.targetY + camState.radius * Math.cos(camState.phi),
          camState.radius * sinPhi * Math.cos(camState.theta)
        );
        camera.lookAt(0, camState.targetY, 0);
        renderer.render(scene, camera);
      }

      loadDefaultGLB(0);
      animate();
    })();
  </script>
</body>
</html>
